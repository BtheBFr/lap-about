<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Lap.comp | Навигатор проектов</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0c10 0%, #12161c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 1.5rem auto;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        /* ========== АНОНСЫ ========== */
        .announcements {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0 2rem 0;
        }

        /* ПК: горизонтальные карточки (как у тебя работало) */
        .announcement-card {
            background: rgba(30, 34, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            padding: 0.6rem 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s ease;
            cursor: default;
        }

        .announcement-card:hover {
            transform: translateY(-2px);
            border-color: rgba(100, 116, 139, 0.4);
            background: rgba(40, 45, 55, 0.9);
        }

        .announcement-badge {
            padding: 0.3rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-news {
            background: linear-gradient(135deg, #3b4252, #2d3340);
            color: #d8dee9;
        }

        .badge-upcoming {
            background: rgba(76, 86, 106, 0.4);
            color: #b0c4de;
            border: 1px solid #4c566a60;
        }

        .announcement-text {
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .announcement-date {
            color: rgba(203, 213, 225, 0.5);
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* ========== ТОЛЬКО ТЕЛЕФОН ========== */
        @media (max-width: 768px) {
            .announcements {
                flex-direction: column;
                gap: 12px;
            }

            /* Каждая карточка — вертикальная, строго по центру, одинакового размера */
            .announcement-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                gap: 8px;
                padding: 16px 12px;
                border-radius: 24px;
                width: 100%;
                min-height: 120px; /* одинаковая высота */
            }

            .announcement-badge {
                align-self: center;
                margin-bottom: 4px;
            }

            .announcement-text {
                font-size: 0.9rem;
                text-align: center;
                padding: 0 8px;
            }

            .announcement-date {
                justify-content: center;
                margin-top: 4px;
            }
        }

        /* ========== КАРТОЧКИ ПРОЕКТОВ ========== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
            margin-top: 1rem;
        }

        .project-card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.2rem;
            padding: 1.2rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            border-color: rgba(100, 116, 139, 0.3);
        }

        .status {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(226, 232, 240, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            align-self: flex-start;
        }

        .status.active {
            background: rgba(67, 127, 185, 0.2);
            color: #7aa2f7;
            border-color: #7aa2f740;
        }

        .status.soon {
            background: rgba(158, 128, 62, 0.2);
            color: #e0af68;
            border-color: #e0af6840;
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .project-description {
            color: #9ca3af;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .link-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 0.7rem;
            padding: 0.3rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .link-text {
            flex: 1;
            color: #7e8a98;
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0.5rem;
            font-family: monospace;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #a0aec0;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-btn:hover {
            background: #2d3748;
            color: #e2e8f0;
        }

        .copy-btn.copied {
            background: #2b6e4f;
            color: white;
        }

        .open-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            background: linear-gradient(135deg, #2d3748, #1a202c);
            color: #e2e8f0;
            text-decoration: none;
            padding: 0.6rem;
            border-radius: 0.8rem;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .open-btn:hover {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            transform: translateY(-1px);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            backdrop-filter: blur(10px);
            color: #f1f5f9;
            padding: 0.7rem 1.5rem;
            border-radius: 60px;
            font-size: 0.85rem;
            border: 1px solid #334155;
            transition: transform 0.2s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            color: #60a5fa;
            margin-right: 0.4rem;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #4b5563;
            font-size: 0.8rem;
        }

        /* Телефон: карточки проектов меньше */
        @media (max-width: 768px) {
            .projects-grid {
                gap: 12px;
            }
            .project-card {
                padding: 14px;
            }
            .project-title {
                font-size: 1.2rem;
            }
            .project-description {
                font-size: 0.8rem;
            }
            .open-btn {
                padding: 0.5rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lap.comp</h1>
            <p>Заходи Лапками на проекты</p>
        </div>

        <div class="announcements" id="announcements-container"></div>

        <div class="projects-grid" id="projects-container"></div>

        <div class="footer">
            <p>Lap.comp · 2026</p>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">Ссылка скопирована!</span>
    </div>

    <script src="projects.js"></script>
    <script>
        function copyToClipboard(text, buttonElement) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                buttonElement.classList.add('copied');
                const originalIcon = buttonElement.innerHTML;
                buttonElement.innerHTML = '<i class="fas fa-check"></i>';
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => {
                    buttonElement.classList.remove('copied');
                    buttonElement.innerHTML = originalIcon;
                }, 1500);
                setTimeout(() => toast.classList.remove('show'), 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                buttonElement.classList.add('copied');
                setTimeout(() => buttonElement.classList.remove('copied'), 1500);
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function renderProjects() {
            const container = document.getElementById('projects-container');
            if (!container || typeof projectsData === 'undefined') return;
            container.innerHTML = '';
            projectsData.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                let titleHtml = project.title;
                if (project.titleSecondLine) titleHtml = project.title + '<br>' + project.titleSecondLine;
                let iconClass = 'fa-clock';
                if (project.status === 'active') iconClass = 'fa-check-circle';
                if (project.status === 'wip') iconClass = 'fa-code-branch';
                if (project.status === 'soon') iconClass = 'fa-clock';
                const link = project.link || '';
                const hasLink = link && link !== '';
                card.innerHTML = `
                    <span class="status ${project.status}"><i class="fas ${iconClass}" style="margin-right: 5px;"></i> ${project.statusText}</span>
                    <h2 class="project-title">${titleHtml}</h2>
                    <p class="project-description">${project.description}</p>
                    <div class="link-container">
                        <span class="link-text">${hasLink ? link : 'Ссылка скоро'}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${hasLink ? link : ''}', this)" title="Копировать ссылку" ${!hasLink ? 'disabled style="opacity:0.4; cursor:not-allowed"' : ''}>
                            <i class="far fa-copy"></i>
                        </button>
                    </div>
                    <a href="${hasLink ? link : '#'}" target="_blank" class="open-btn" ${!hasLink ? 'style="pointer-events:none; opacity:0.6"' : ''}>
                        <i class="fas fa-external-link-alt"></i>
                        ${hasLink ? 'Открыть сайт' : 'Скоро появится'}
                    </a>
                `;
                container.appendChild(card);
            });
        }

        function renderAnnouncements() {
            const container = document.getElementById('announcements-container');
            if (!container || typeof announcementsData === 'undefined') return;
            container.innerHTML = '';
            announcementsData.forEach(announcement => {
                const card = document.createElement('div');
                card.className = 'announcement-card';
                card.innerHTML = `
                    <span class="announcement-badge badge-${announcement.badge}">
                        <i class="fas ${announcement.icon || (announcement.badge === 'news' ? 'fa-star' : 'fa-hourglass-half')}" style="margin-right: 5px; font-size: 0.7rem;"></i>
                        ${announcement.badgeText}
                    </span>
                    <span class="announcement-text">${announcement.text}</span>
                    <span class="announcement-date">
                        <i class="far ${announcement.badge === 'news' ? 'fa-calendar-alt' : 'fa-clock'}"></i>
                        ${announcement.date}
                    </span>
                `;
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
            renderAnnouncements();
        });
    </script>
</body>
</html>
