<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Lap.comp | Навигатор проектов</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0c10 0%, #12161c 100%);
            padding: 16px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(0.85rem, 4vw, 1rem);
        }

        .announcements {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0 24px 0;
        }

        .announcement-card {
            background: rgba(30, 34, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            padding: 6px 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        /* На телефонах карточки анонсов занимают всю ширину */
        @media (max-width: 550px) {
            .announcement-card {
                width: 100%;
                justify-content: space-between;
                padding: 8px 14px;
            }
        }

        .announcement-badge {
            padding: 4px 10px;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-news {
            background: linear-gradient(135deg, #3b4252, #2d3340);
            color: #d8dee9;
        }

        .badge-upcoming {
            background: rgba(76, 86, 106, 0.4);
            color: #b0c4de;
            border: 1px solid #4c566a60;
        }

        .announcement-text {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 500;
            flex: 1;
            text-align: left;
        }

        .announcement-date {
            color: rgba(203, 213, 225, 0.5);
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (max-width: 550px) {
            .announcement-text {
                font-size: 0.8rem;
            }
            .announcement-date {
                font-size: 0.65rem;
            }
            .announcement-badge {
                font-size: 0.65rem;
                padding: 3px 8px;
            }
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        @media (min-width: 600px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1000px) {
            .projects-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
        }

        .project-card {
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 18px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            border-color: rgba(100, 116, 139, 0.3);
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(226, 232, 240, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            align-self: flex-start;
            white-space: nowrap;
        }

        .status.active {
            background: rgba(67, 127, 185, 0.2);
            color: #7aa2f7;
            border-color: #7aa2f740;
        }

        .status.soon {
            background: rgba(158, 128, 62, 0.2);
            color: #e0af68;
            border-color: #e0af6840;
        }

        .status.wip {
            background: rgba(73, 127, 103, 0.2);
            color: #9ece6a;
            border-color: #9ece6a40;
        }

        .project-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .project-description {
            color: #9ca3af;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 16px;
            flex-grow: 1;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .link-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            width: 100%;
            box-sizing: border-box;
        }

        .link-text {
            flex: 1;
            color: #7e8a98;
            font-size: 0.7rem;
            padding: 6px 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            font-family: monospace;
        }

        @media (max-width: 500px) {
            .link-text {
                font-size: 0.65rem;
                white-space: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #a0aec0;
            width: 34px;
            min-width: 34px;
            height: 34px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: #2d3748;
            color: #e2e8f0;
        }

        .copy-btn.copied {
            background: #2b6e4f;
            color: white;
        }

        .open-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #2d3748, #1a202c);
            color: #e2e8f0;
            text-decoration: none;
            padding: 10px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-sizing: border-box;
        }

        .open-btn:hover {
            background: linear-gradient(135deg, #4a5568, #2d3748);
            transform: translateY(-1px);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            backdrop-filter: blur(10px);
            color: #f1f5f9;
            padding: 10px 20px;
            border-radius: 60px;
            font-size: 0.85rem;
            border: 1px solid #334155;
            transition: transform 0.2s ease;
            z-index: 1000;
            white-space: nowrap;
        }

        @media (max-width: 500px) {
            .toast {
                font-size: 0.75rem;
                padding: 8px 16px;
                white-space: nowrap;
            }
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            color: #60a5fa;
            margin-right: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            color: #4b5563;
            font-size: 0.75rem;
            padding-bottom: 10px;
        }

        body {
            overflow-x: hidden;
        }

        .container {
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lap.comp</h1>
            <p>Заходи Лапками на проекты</p>
        </div>

        <div class="announcements" id="announcements-container"></div>

        <div class="projects-grid" id="projects-container"></div>

        <div class="footer">
            <p>Lap.comp · 2026</p>
        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toast-message">Ссылка скопирована!</span>
    </div>

    <script src="projects.js"></script>
    <script>
        function copyToClipboard(text, buttonElement) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                buttonElement.classList.add('copied');
                const originalIcon = buttonElement.innerHTML;
                buttonElement.innerHTML = '<i class="fas fa-check"></i>';
                
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                
                setTimeout(() => {
                    buttonElement.classList.remove('copied');
                    buttonElement.innerHTML = originalIcon;
                }, 1500);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                buttonElement.classList.add('copied');
                setTimeout(() => buttonElement.classList.remove('copied'), 1500);
                
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function renderProjects() {
            const container = document.getElementById('projects-container');
            if (!container || typeof projectsData === 'undefined') return;
            container.innerHTML = '';
            
            projectsData.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                let titleHtml = project.title;
                if (project.titleSecondLine) {
                    titleHtml = project.title + '<br>' + project.titleSecondLine;
                }
                
                let iconClass = 'fa-clock';
                if (project.status === 'active') iconClass = 'fa-check-circle';
                if (project.status === 'wip') iconClass = 'fa-code-branch';
                if (project.status === 'soon') iconClass = 'fa-clock';
                
                const link = project.link || '';
                const hasLink = link && link !== '';
                
                card.innerHTML = `
                    <span class="status ${project.status}"><i class="fas ${iconClass}" style="margin-right: 5px;"></i> ${project.statusText}</span>
                    <h2 class="project-title">${titleHtml}</h2>
                    <p class="project-description">${project.description}</p>
                    <div class="link-container">
                        <span class="link-text">${hasLink ? link : 'Ссылка скоро'}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${hasLink ? link : ''}', this)" title="Копировать ссылку" ${!hasLink ? 'disabled style="opacity:0.4; cursor:not-allowed"' : ''}>
                            <i class="far fa-copy"></i>
                        </button>
                    </div>
                    <a href="${hasLink ? link : '#'}" target="_blank" class="open-btn" ${!hasLink ? 'style="pointer-events:none; opacity:0.6"' : ''}>
                        <i class="fas fa-external-link-alt"></i>
                        ${hasLink ? 'Открыть сайт' : 'Скоро появится'}
                    </a>
                `;
                
                container.appendChild(card);
            });
        }

        function renderAnnouncements() {
            const container = document.getElementById('announcements-container');
            if (!container || typeof announcementsData === 'undefined') return;
            
            container.innerHTML = '';
            
            announcementsData.forEach(announcement => {
                const card = document.createElement('div');
                card.className = 'announcement-card';
                
                card.innerHTML = `
                    <span class="announcement-badge badge-${announcement.badge}">
                        <i class="fas ${announcement.icon || (announcement.badge === 'news' ? 'fa-star' : 'fa-hourglass-half')}" style="margin-right: 4px; font-size: 0.65rem;"></i>
                        ${announcement.badgeText}
                    </span>
                    <span class="announcement-text">${announcement.text}</span>
                    <span class="announcement-date">
                        <i class="far ${announcement.badge === 'news' ? 'fa-calendar-alt' : 'fa-clock'}"></i>
                        ${announcement.date}
                    </span>
                `;
                
                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProjects();
            renderAnnouncements();
        });
    </script>
</body>
</html>
